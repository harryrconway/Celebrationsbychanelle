<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Wedding Planning Checklist | Celebrations by Chanelle</title>
  <meta name="description" content="A printable wedding ceremony planning checklist from Celebrations by Chanelle.">
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="checklist.css">
</head>
<body>
  <header>
    <p class="script">Celebrations</p>
    <p class="sub">by Chanelle</p>
    <h1>Wedding Planning Checklist</h1>
  </header>
  <main>
    <div class="actions">
      <a href="../#resources">&larr; Back to the website</a>
      <button type="button" data-print>Print / save as PDF</button>
    </div>

    <section>
      <h2>12 to 18 months to go</h2>
      <ul>
        <li><label><input type="checkbox"><span>Set your budget and rough guest numbers</span></label></li>
        <li><label><input type="checkbox"><span>Choose your date and book your venue</span></label></li>
        <li><label><input type="checkbox"><span>Book your celebrant (hi!)</span></label></li>
        <li><label><input type="checkbox"><span>Lodge your Notice of Intended Marriage (no earlier than 18 months before)</span></label></li>
        <li><label><input type="checkbox"><span>Book photographer, videographer and any key suppliers</span></label></li>
      </ul>
    </section>

    <section>
      <h2>6 to 12 months to go</h2>
      <ul>
        <li><label><input type="checkbox"><span>Gather birth certificates / passports and photo ID</span></label></li>
        <li><label><input type="checkbox"><span>If previously married: find your divorce or death certificate</span></label></li>
        <li><label><input type="checkbox"><span>Send save the dates</span></label></li>
        <li><label><input type="checkbox"><span>Choose your wedding party and outfits</span></label></li>
        <li><label><input type="checkbox"><span>Book florist, music and hire items</span></label></li>
      </ul>
    </section>

    <section>
      <h2>3 to 6 months to go</h2>
      <ul>
        <li><label><input type="checkbox"><span>Planning meeting with Chanelle &amp; complete your love story questionnaire</span></label></li>
        <li><label><input type="checkbox"><span>Pick readings, readers and any rituals (ring warming, handfasting…)</span></label></li>
        <li><label><input type="checkbox"><span>Send invitations</span></label></li>
        <li><label><input type="checkbox"><span>Choose and order rings</span></label></li>
      </ul>
    </section>

    <section>
      <h2>1 to 2 months to go</h2>
      <ul>
        <li><label><input type="checkbox"><span>NOIM must be lodged by now (at least one month before)</span></label></li>
        <li><label><input type="checkbox"><span>Write your vows (if you're writing your own)</span></label></li>
        <li><label><input type="checkbox"><span>Confirm your two witnesses (18+)</span></label></li>
        <li><label><input type="checkbox"><span>Finalise ceremony running order and music cues</span></label></li>
        <li><label><input type="checkbox"><span>Confirm final numbers with suppliers</span></label></li>
      </ul>
    </section>

    <section>
      <h2>Wedding week</h2>
      <ul>
        <li><label><input type="checkbox"><span>Ceremony rehearsal</span></label></li>
        <li><label><input type="checkbox"><span>Sign your Declaration of No Legal Impediment</span></label></li>
        <li><label><input type="checkbox"><span>Give rings to your ring bearer / best person</span></label></li>
        <li><label><input type="checkbox"><span>Breathe, rest and hydrate!</span></label></li>
      </ul>
    </section>

    <section>
      <h2>After the big day</h2>
      <ul>
        <li><label><input type="checkbox"><span>Chanelle registers your marriage with QLD BDM (within 14 days)</span></label></li>
        <li><label><input type="checkbox"><span>Order your official marriage certificate</span></label></li>
        <li><label><input type="checkbox"><span>Update your name (if changing): licence, passport, bank, Medicare</span></label></li>
        <li><label><input type="checkbox"><span>Send thank you notes</span></label></li>
      </ul>
    </section>
  </main>
  <footer>
    <span class="tag">Love · Legacy · You</span>
    hello@celebrationsbychanelle.com.au · Gold Coast &amp; beyond
  </footer>
  <script src="checklist.js" defer></script>
</body>
</html>
